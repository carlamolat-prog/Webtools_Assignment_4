<!DOCTYPE html>
<html lang="eng">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width-device-width, initial-scale=1.0">
 <title>Local Weather</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
   <h1>Local Weather</h1>
  </header>
  <main>
      <section id="search">
      <h2>Search City</h2>
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="getWeatherBtn">Get Weather</button>
    </section>

    <section id="results">
      <h2>Current Conditions</h2>
      <div class="weather-card">
        <h3 id="cityName"></h3>
        <p id="temperature"></p>
        <p id="description"></p>
        <p id="humidity"></p>
      </div>
    </section>

    <section id="error" aria-live="polite"></section>
  </main>
</body> 
<footer>
 <p>Powered by OpenWeatherMap API</p>
 <p>Contact at <a href="s2091636@fscj.edu">Carl</a></p>
</footer> 
</html>
